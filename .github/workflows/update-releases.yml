
name: Update Latest Projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-releases.yml"

concurrency:
  group: update-latest-projects
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update README with latest projects
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const profileRepo = context.repo.repo;

            const markerStart = '<!-- RELEASES:START -->';
            const markerEnd = '<!-- RELEASES:END -->';

            const repositories = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: owner,
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              }
            );

            const projects = repositories
              .filter(repo => !repo.fork)
              .filter(repo => !repo.archived)
              .filter(repo => repo.name !== profileRepo)
              .sort((a, b) =>
                new Date(b.pushed_at || b.updated_at) -
                new Date(a.pushed_at || a.updated_at)
              )
              .slice(0, 8);

            let content;

            if (projects.length === 0) {
              content = '_Ainda não há projetos públicos para listar._';
            } else {
              content = projects.map(repo => {
                const description = repo.description
                  ? repo.description.replace(/\r?\n/g, ' ').trim()
                  : 'Projeto em desenvolvimento';

                const language = repo.language
                  ? ` · \`${repo.language}\``
                  : '';

                const updated = repo.pushed_at
                  ? new Date(repo.pushed_at).toLocaleDateString('pt-BR', {
                      day: '2-digit',
                      month: '2-digit',
                      year: 'numeric',
                      timeZone: 'UTC'
                    })
                  : 'Data indisponível';

                return [
                  `- **[${repo.name}](${repo.html_url})**${language}`,
                  `  ${description}`,
                  `  <sub>Último push: ${updated}</sub>`
                ].join('\n');
              }).join('\n\n');
            }

            const readmePath = 'README.md';

            if (!fs.existsSync(readmePath)) {
              core.setFailed('README.md não foi encontrado.');
              return;
            }

            let readme = fs.readFileSync(readmePath, 'utf8');

            const startIndex = readme.indexOf(markerStart);
            const endIndex = readme.indexOf(markerEnd);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              core.setFailed(
                'Adicione os marcadores RELEASES:START e RELEASES:END ao README.md.'
              );
              return;
            }

            const before = readme.slice(
              0,
              startIndex + markerStart.length
            );

            const after = readme.slice(endIndex);

            readme = `${before}\n\n${content}\n\n${after}`;

            fs.writeFileSync(readmePath, readme);

            core.info(`README atualizado com ${projects.length} projetos.`);

      - name: Commit and push README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no README."
            exit 0
          fi

          git commit -m "chore: update latest projects"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
