
name: Update Latest GitHub Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-releases.yml"

concurrency:
  group: update-releases-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update README with latest releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const profileRepo = context.repo.repo;
            const markerStart = '<!-- RELEASES:START -->';
            const markerEnd = '<!-- RELEASES:END -->';

            const repositories = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: owner,
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              }
            );

            const releases = [];

            for (const repo of repositories) {
              if (repo.fork) continue;
              if (repo.name === profileRepo) continue;
              if (repo.archived) continue;

              try {
                const response = await github.rest.repos.listReleases({
                  owner,
                  repo: repo.name,
                  per_page: 10
                });

                for (const release of response.data) {
                  if (release.draft || release.prerelease) continue;

                  releases.push({
                    name: release.name || release.tag_name,
                    tag: release.tag_name,
                    url: release.html_url,
                    date: release.published_at,
                    repo: repo.name
                  });
                }
              } catch (error) {
                core.warning(
                  `Could not read releases from ${repo.name}: ${error.message}`
                );
              }
            }

            releases.sort((a, b) => {
              return new Date(b.date || 0) - new Date(a.date || 0);
            });

            const latest = releases.slice(0, 8);

            let content;

            if (latest.length === 0) {
              content = '_Nenhum lançamento publicado encontrado por enquanto._';
            } else {
              content = latest.map(release => {
                const date = release.date
                  ? new Date(release.date).toLocaleDateString('pt-BR', {
                      day: '2-digit',
                      month: '2-digit',
                      year: 'numeric',
                      timeZone: 'UTC'
                    })
                  : 'Data indisponível';

                return `- **[${release.name}](${release.url})** — \`${release.tag}\` · repositório \`${release.repo}\` · ${date}`;
              }).join('\n');
            }

            const readmePath = 'README.md';

            if (!fs.existsSync(readmePath)) {
              core.setFailed('README.md was not found.');
              return;
            }

            let readme = fs.readFileSync(readmePath, 'utf8');

            const startIndex = readme.indexOf(markerStart);
            const endIndex = readme.indexOf(markerEnd);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              core.setFailed(
                'Release markers were not found in README.md. ' +
                'Add <!-- RELEASES:START --> and <!-- RELEASES:END -->.'
              );
              return;
            }

            const before = readme.slice(
              0,
              startIndex + markerStart.length
            );

            const after = readme.slice(endIndex);

            readme = `${before}\n${content}\n${after}`;

            fs.writeFileSync(readmePath, readme);

            core.info(`README updated with ${latest.length} releases.`);

      - name: Commit and push README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update latest GitHub releases"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
